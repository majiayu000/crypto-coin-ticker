[package]
name = "okk"
version = "0.2.0"
edition = "2024"
license = "MIT"

# Performance optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true




[dependencies]
# Core dependencies
anyhow = "1.0.98"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

# Exchange API
futures = "0.3.31"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

# Data types
chrono = "0.4.41"

# Configuration and serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# UI
tao = "0.34.0"
tray-icon = "0.21.0"
image = "0.25.6"
